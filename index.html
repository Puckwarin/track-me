<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7c3aed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png">
  <title>Track Me — อาหาร ประจำเดือน น้ำหนัก</title>
</head>
<body class="text-slate-800 min-h-screen pb-12 font-sans">

  <!-- Login -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center p-6">
    <div class="card max-w-sm w-full text-center space-y-4 !p-8">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-lav-soft flex items-center justify-center text-3xl">💜</div>
      <h1 class="text-2xl font-bold text-brand-dark">Track Me</h1>
      <p class="text-sm text-slate-500">ติดตามอาหาร ประจำเดือน และน้ำหนักในที่เดียว<br>ข้อมูลเป็นของคุณคนเดียว ผูกกับบัญชี Google</p>
      <button id="btn-google" class="btn btn-primary w-full justify-center"><b>G</b> เข้าสู่ระบบด้วย Google</button>
      <p id="login-error" class="text-xs text-rose-600"></p>
      <p class="text-xs text-slate-400">ล็อกอินครั้งแรกต้องออนไลน์ หลังจากนั้นใช้งานออฟไลน์ได้</p>
    </div>
  </div>

  <div id="app-lock" class="hidden fixed inset-0 z-[120] bg-app-bg flex items-center justify-center p-6">
    <form id="lock-form" class="card max-w-sm w-full text-center space-y-4 !p-8">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-lav-soft flex items-center justify-center text-3xl">🔒</div>
      <h1 class="text-xl font-bold text-brand-dark">Track Me ถูกล็อกอยู่</h1>
      <p class="text-sm text-slate-500">กรอก PIN 4 หลักเพื่อเปิดแอปบนอุปกรณ์นี้</p>
      <input id="lock-pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="one-time-code" class="input text-center !text-2xl tracking-[.6em]" aria-label="PIN 4 หลัก">
      <p id="lock-error" class="text-xs text-rose-600"></p>
      <button id="lock-submit" type="submit" class="btn btn-primary w-full justify-center">ปลดล็อก</button>
      <button id="lock-reset" type="button" class="text-xs text-slate-500 underline">ลืม PIN? ยืนยันบัญชี Google เพื่อรีเซ็ต</button>
      <button id="lock-signout" type="button" class="text-xs text-slate-500 underline">ออกจากระบบ Google</button>
    </form>
  </div>

  <div id="app-shell" class="hidden">
    <header class="bg-brand shadow-md sticky top-0 z-40">
      <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
        <h1 class="text-xl font-bold text-white flex items-center gap-2"><i class="fa-solid fa-heart-pulse"></i> Track Me</h1>
        <div class="flex items-center gap-3">
          <span class="text-xs bg-white/15 text-white px-2.5 py-1 rounded-full flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse" id="sync-dot"></span><span id="sync-text">กำลังเชื่อมต่อ...</span></span>
          <button id="btn-settings" class="bg-white/15 hover:bg-white/25 text-white px-3 py-1.5 rounded-lg text-sm flex items-center gap-1.5"><i class="fa-solid fa-gear"></i> <span class="hidden sm:inline">ตั้งค่า</span></button>
        </div>
      </div>
    </header>
    <div id="reminder-banner" class="hidden bg-pink-soft text-pink-800 border-b border-pink-200"></div>

    <section id="summary-section" class="max-w-6xl mx-auto px-4 mt-6">
      <div class="card !border-pink-soft">
        <div class="flex flex-wrap justify-between items-center gap-2 mb-3">
          <h2 class="text-base font-bold text-slate-800"><i class="fa-solid fa-user-doctor text-pink-500"></i> สรุปสุขภาพล่าสุด (เปิดดูตอนพบแพทย์)</h2>
          <button id="btn-copy-summary" class="chip bg-pink-soft text-pink-700"><i class="fa-regular fa-copy"></i> คัดลอกสรุป</button>
        </div>
        <div id="summary-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-3"></div>
        <p id="sum-sync" class="text-xs text-slate-500 mt-3"></p>
      </div>
    </section>

    <nav class="max-w-6xl mx-auto px-4 mt-4 flex gap-2 overflow-x-auto pb-1">
      <button id="tabbtn-food"><i class="fa-solid fa-utensils"></i> อาหาร</button>
      <button id="tabbtn-period"><i class="fa-solid fa-droplet"></i> ประจำเดือน</button>
      <button id="tabbtn-symptoms"><i class="fa-solid fa-notes-medical"></i> อาการ</button>
      <button id="tabbtn-body"><i class="fa-solid fa-weight-scale"></i> น้ำหนัก & สัดส่วน</button>
      <button id="tabbtn-report"><i class="fa-solid fa-file-medical"></i> รายงาน</button>
    </nav>

    <main id="tab-food" class="max-w-6xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-3 gap-6"></main>
    <main id="tab-period" class="hidden max-w-6xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-3 gap-6"></main>
    <main id="tab-symptoms" class="hidden max-w-6xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-3 gap-6"></main>
    <main id="tab-body" class="hidden max-w-6xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-3 gap-6"></main>
    <main id="tab-report" class="hidden max-w-6xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-3 gap-6"></main>
    <main id="tab-settings" class="hidden max-w-6xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-3 gap-6"></main>
  </div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
